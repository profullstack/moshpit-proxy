# Moshpit gateway, topology B: route on SNI, never decrypt.
#
# There is no ssl_certificate directive anywhere in this file, and that is the
# point. `ssl_preread` reads the server name out of the ClientHello — which is
# sent in the clear, before any key exchange — and forwards the still-encrypted
# stream to the origin. nginx holds no private key for any Moshpit name and
# cannot read a byte of what passes through it.
#
# What the gateway still learns: which name was requested, the client address,
# and how many bytes moved. That is what a router learns. What it no longer
# learns: everything else.
#
# Install:
#   cp moshpit-gateway.conf /etc/nginx/conf.d/       # if `stream` is in nginx.conf
#   bun run scripts/gen-upstreams.ts                 # writes the map, reloads
#
# The ngx_stream_module is dynamic on this build, so nginx.conf needs:
#   load_module modules/ngx_stream_module.so;
# at the top level, before the stream block below is included.

stream {
    # Origins may be listed by hostname. Point this at the local Moshpit
    # resolver so a `.moshpit` target resolves the same way here as anywhere.
    resolver 127.0.0.1:53 ipv6=on valid=30s;
    resolver_timeout 3s;

    log_format moshpit '$remote_addr "$ssl_preread_server_name" '
                       '-> $moshpit_origin $status '
                       '$bytes_sent/$bytes_received $session_time';

    access_log /var/log/nginx/moshpit-gateway.log moshpit;
    error_log  /var/log/nginx/moshpit-gateway.error.log warn;

    # Generated from the registry; one `name  host:port;` per line.
    # Regenerating and reloading is cheap, and registrations change slowly, so
    # this stays a static map rather than a per-connection lookup. A dynamic
    # lookup here would put the registry on the path of every TCP handshake —
    # the gateway would stop working the moment the registry hiccuped.
    map $ssl_preread_server_name $moshpit_origin {
        hostnames;

        # Discard port. An unknown name gets a refused connection rather than
        # an nginx config error, and rather than being silently sent anywhere.
        default 127.0.0.1:9;

        include /etc/nginx/moshpit-upstreams.map;
    }

    server {
        listen 443;
        listen [::]:443;

        ssl_preread on;
        proxy_pass  $moshpit_origin;

        proxy_connect_timeout 5s;
        proxy_timeout         10m;

        # Origins commonly sit behind NAT on home connections; a half-open
        # session should not hold a worker slot for the full proxy_timeout.
        proxy_socket_keepalive on;
    }
}
