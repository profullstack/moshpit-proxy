# A Moshpit origin: serve one name over TLS with a key nobody vouched for.
#
# This is the other half of `moshpit-gateway.conf`. The gateway routes without
# decrypting; this is the box that actually terminates the session, and it is
# the only place in the whole path that holds a private key for the name.
#
# The certificate here is self-signed *on purpose*, and it is not a compromise.
# No CA will issue for a Moshpit TLD — the CA/Browser Forum banned non-IANA
# names in 2015 — so the trust does not come from an issuer. It comes from the
# registry, which publishes SHA-256(SubjectPublicKeyInfo) for this name and lets
# every client check the key it was handed against it. An expensive certificate
# and this one are worth exactly the same here, so this one is correct.
#
# Replace NAME below, or let `scripts/setup-origin.sh` do it and publish the pin.

server {
    listen 80;
    listen [::]:80;
    server_name NAME;

    # Keep this. Upgrading to HTTPS is right, and it was only ever a problem
    # when there was no 443 block for the name to land on — which produced a
    # certificate for whatever the default vhost happened to hold, and an error
    # that looks like Moshpit is broken when it is nginx that is misconfigured.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name NAME;

    # A name with no matching server block falls through to the default vhost,
    # whose certificate is for some other name entirely. That is a name mismatch
    # in the browser and it is the single most common way an origin looks broken.
    # If this is the only site on the box, add `default_server` to the listens.

    ssl_certificate     /etc/ssl/moshpit/NAME.crt;
    ssl_certificate_key /etc/ssl/moshpit/NAME.key;

    # 1.3 only. There is no legacy client to support here — every Moshpit client
    # is either TronBrowser, moshpit-proxy or a native SDK, all of them current —
    # and 1.3 is what carries the hybrid key exchange below.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Post-quantum key agreement, hybrid with X25519 so that breaking either one
    # alone is not enough. Needs nginx built against OpenSSL 3.5+; check with
    # `nginx -V 2>&1 | grep -o 'OpenSSL [0-9.]*'`. On an older build nginx will
    # fail to start with "SSL_CONF_cmd Groups" — delete this line and the site
    # still works, just without the post-quantum half. moshpit-proxy will log
    # `origin has no ML-KEM` when that happens, so it is visible rather than silent.
    ssl_conf_command Groups X25519MLKEM768:X25519:P-256;

    # Session tickets off: they are a second, weaker way to resume that does not
    # go through the pin check.
    ssl_session_tickets off;
    ssl_session_cache shared:MoshpitSSL:10m;

    # HSTS is deliberately absent. It is a promise to a browser about a name the
    # public DNS does not own, and a stale HSTS entry for a Moshpit name is not
    # something a user can easily clear.

    access_log /var/log/nginx/NAME.access.log;
    error_log  /var/log/nginx/NAME.error.log warn;

    root /var/www/NAME;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serving an app instead of files? Replace the block above with:
    #
    #   location / {
    #       proxy_pass http://127.0.0.1:8080;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Forwarded-Proto https;
    #       proxy_http_version 1.1;
    #   }
}
