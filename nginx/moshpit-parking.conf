# Parking: the address a claimed-but-unpointed Moshpit name resolves to.
#
# A name with no target is not an error — it is a name waiting to be pointed
# somewhere, so the resolver hands back an address instead of NXDOMAIN. That
# only works if something is listening on it. Nothing was.
#
# What the resolver parks a name on is the gateway's address, and the gateway
# host has been `pit.moshcode.sh`, which is a Railway deployment. Railway routes
# by an explicit list of custom domains with no catch-all, and a Moshpit ending
# can never be on that list: `.eggs` is not in the public DNS root, so Railway
# cannot verify it and no CA will issue for it. An unknown `Host` therefore never
# reaches the app at all — the edge answers it first:
#
#     $ curl -L http://scrambled.eggs/
#     301 -> https://scrambled.eggs/
#     404  Not Found — "The train has not arrived at the station."
#
# That 404 is Railway's, not ours, and every parked name in the registry got it.
# The name resolved, the page existed at pit.moshcode.sh/n/<name>, and the one
# hop between them was a platform that had never heard of the name.
#
# So parking gets its own server block on a box we route ourselves. It holds no
# content: it turns the `Host` back into a name and sends the visitor to that
# name's page in the Pit — the same thing `moshcoding.com` does when a request
# actually reaches it, and the same thing the moshcode CLI's local parking
# responder does when it can bind port 80.
#
# Install:
#   cp moshpit-parking.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
#
# Then point the resolver's gateway at this box, so parked names arrive here
# rather than at Railway — in moshpit-dns.service:
#
#   Environment=MOSHPIT_GATEWAY_HOST=park.moshcode.sh
#
# `MOSHPIT_GATEWAY_A` / `MOSHPIT_GATEWAY_AAAA` pin the addresses directly when
# there is no hostname for the parking box yet.

# Which names this box will send to the Pit.
#
# `$host` is already lowercased and has no port, so the shapes below are the
# whole test. One label and one ending is the only shape the registry holds; a
# deeper name (`blog.chovy.hacker`) and a bare address both go to the Pit's
# front door instead, which is the same rule the CLI's parking responder uses.
#
# The clearnet row is not redundant. Real TLDs *are* claimed as Moshpit endings
# — `.io`, `.dev`, `.app`, `.ai`, `.sh` and `.co` all have owners in the pit —
# and the `server_name` regex below matches any two-label host, so an ordinary
# domain pointed here by mistake or by a scanner lands in this block too. House
# policy is that clearnet wins by default: a resolver that silently redirects a
# domain which already works is indistinguishable from a hijack. Bouncing
# example.com to the Pit would be exactly that, so it is refused here and left
# to the Pit's front door.
#
# Regex rows are tried in order and the first match wins, so clearnet is listed
# before the general shape on purpose.
map $host $moshpit_parked_name {
    default "";

    "~^[a-z0-9-]+\.(com|net|org|edu|gov|mil|int|io|dev|app|ai|sh|co|me|xyz|info|biz|online|site|tech|cloud|link|page|blog|news|live|run|gg|to|tv|fm|us|uk|ca|de|fr|es|it|nl|eu|au|nz|jp|cn|in|br|ru)$" "";

    "~^[a-z0-9-]+\.[a-z0-9-]+$" $host;
}

# Built here rather than with an `if` in the location, so the redirect is one
# unconditional `return` and the branch is data.
map $moshpit_parked_name $moshpit_parking_target {
    default "https://pit.moshcode.sh/n/$moshpit_parked_name";
    ""      "https://pit.moshcode.sh/pit";
}

server {
    listen 80;
    listen [::]:80;

    # A regex `server_name`, and deliberately not `default_server`.
    #
    # `default_server` was the obvious spelling and it does not survive contact
    # with a real box: nginx allows exactly one per listen socket, and the boxes
    # that would host parking already have one — a userdir vhost, an ACME
    # responder, whatever answers for the machine's own name. Adding a second is
    # not a warning, it is `nginx -t` failing outright with "a duplicate default
    # server for 0.0.0.0:80", which then blocks every later reload on the box,
    # including certbot's.
    #
    # A regex gets there without the collision. nginx matches server names in a
    # fixed order — exact, then leading wildcard, then trailing wildcard, then
    # the first matching regex — and only falls back to the default server when
    # nothing matched at all. So this block sits below every name the box
    # actually serves (`chovy.hacker` keeps its own vhost) and above the default
    # server, which is precisely where parking belongs.
    #
    # One label and one ending is the only shape the registry holds, so that is
    # the only shape claimed here; a deeper name or a bare address is left to
    # whatever this box already does with it.
    server_name "~^[a-z0-9-]+\.[a-z0-9-]+$";

    # Real TLDs are claimed as Moshpit endings too, so this regex also matches
    # ordinary two-label domains. An http-01 challenge is fetched over http and
    # must reach the webroot rather than a redirect — without this, issuing a
    # certificate for any two-label domain on this box would start failing the
    # moment parking was installed, which is a slow and confusing way to find
    # out. Same carve-out, and same reason, as the userdir vhost's.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # Port 80 only, and no redirect to HTTPS.
    #
    # `moshpit-origin.conf` explains the general form of this; parking is the
    # sharper case. There is no certificate that could be presented for a parked
    # name — it has no origin and no key, so there is not even a pin to check —
    # and the default server's certificate is for some other name entirely.
    # Redirecting to HTTPS would trade a working page for a certificate error
    # that reads as "Moshpit is broken", which is the failure this file exists
    # to remove.
    #
    # This is also why the redirect below leaves port 80 and lands on
    # pit.moshcode.sh over HTTPS: that host is in the public DNS root, has an
    # ordinary certificate, and every client can verify it.

    access_log /var/log/nginx/moshpit-parking.access.log;
    error_log  /var/log/nginx/moshpit-parking.error.log warn;

    # 302, not 301. The owner can point this name at a real target at any
    # moment, and a permanent redirect cached in a browser would keep sending
    # them to the Pit long after the name started answering for itself.
    location / {
        return 302 $moshpit_parking_target;
    }

    # Running a private registry? Change the two `pit.moshcode.sh` values in the
    # map above; nothing else in this file knows the registry's address.
}
