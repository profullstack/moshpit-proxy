# The Moshpit resolver, as this machine's primary DNS.
#
# This must be the ONLY drop-in that sets DNS=. Delete any other — a cloud
# image's DigitalOcean.conf, or the moshpit.conf that `moshcode dns enable`
# used to write:
#
#     rm /etc/systemd/resolved.conf.d/DigitalOcean.conf
#     systemctl restart systemd-resolved
#     resolvectl status | grep -A1 'DNS Servers'   # only 127.0.0.1:5354
#
# A second drop-in appends its servers to the same list, and that list is a
# trap rather than a safety net. systemd-resolved rotates away from a server
# that fails and DOES NOT ROTATE BACK, so one restart of the bridge moves every
# query to the fallback permanently. The fallback answers NXDOMAIN for every
# Moshpit name, which means DNS looks healthy while the entire namespace is
# dead — the worst shape a failure can take, because nothing is obviously
# broken to look at.
#
# Observed three times in one afternoon before it was understood. `dig
# @127.0.0.1 -p 5354 seo.rank` answered, `curl seo.rank` did not, and
# `resolvectl status` showed the bridge listed and 67.207.67.3 current.
#
# A fallback also buys nothing. The bridge forwards everything it cannot answer
# to the upstreams itself (mode=clearnet), so a second entry adds no capability
# — only the failure above. If the bridge stops, the answer is to restart it,
# which moshpit-dns.service already does in two seconds (Restart=always,
# RestartSec=2). Two seconds of no DNS beats an afternoon of DNS that lies.
#
# There is deliberately no Domains= line, and that is the whole point.
#
# The old approach listed every claimed Moshpit ending as a routing domain --
# 5,661 of them, ~60KB on one line. systemd-resolved caps search domains at
# about 1090 and drops the rest alphabetically, logging 8,199 lines of
# "Failed to add search domain '~zoology', ignoring: Argument list too long".
# Endings past the cut (~hacker and ~eggs among them) were configured on disk
# and absent from the resolver, so the bridge answered `dig` and the browser
# still got nothing. It also does not scale: every new ending needs another
# entry, and regenerating the file clobbers any hand-curated version.
#
# It cannot be fixed by curating the list either. A routing domain sends the
# query to a *scope*, and a scope tries its servers in order -- so with DO's
# resolvers in the same global scope, `.hacker` went to 67.207.67.3, came back
# NXDOMAIN, and resolved treated that as final. The bridge was never asked.
#
# Sending everything to the bridge removes all of it. It answers Moshpit names
# from the registry and forwards the rest upstream (mode=clearnet: the ordinary
# internet owns any name it can answer; the registry is only a backfill).
# Nothing to list, no cap to hit, nothing to regenerate.

[Resolve]
DNS=127.0.0.1:5354
